schema_version: '1.0'
component_id: TX-D01
component_type: MICRO_SKILL
traits:
- transversal
name: Redacción pedagógica sustentada
domain: Académico
head: FLUFFY · PRODUCE
version: '0.1'
lifecycle_status: ACTIVE
architecture_status: READY_WITH_CONDITIONS
implementation_status: IMPLEMENTABLE_WITH_CONDITIONS
deployment_status: PILOT_OR_BLOCKED
purpose: Convertir contenido respaldado por fuentes autorizadas en explicación pedagógica clara, académica y accesible, preservando
  fidelidad factual y distinguiendo explicación principal de lectura complementaria.
users:
  primary: otros componentes de Cerros AI y docentes
  secondary: []
triggers:
- FL-D01 necesita desarrollar explicación o lectura.
- Otro producto pedagógico necesita texto explicativo sustentado.
required_inputs:
- Propósito del aprendizaje.
- Nivel/grado.
- Fuentes autorizadas.
- 'Tipo de texto: explicación principal o lectura complementaria.'
optional_inputs:
- Extensión objetivo.
- Preguntas/reflexiones.
- Formato de citación.
authoritative_sources:
- source: Fuentes aportadas/autorizadas
  function: Contenido factual
  rule: No incorporar hechos no soportados.
- source: Planificación
  function: Propósito y nivel
  rule: Determina qué explicar y para qué.
- source: Reglas del producto llamante
  function: Formato/extensión
  rule: 'Ej.: lectura complementaria 2–4 páginas.'
source_hierarchy: []
knowledge_dependencies: []
core_rules_inherited:
- No inventar ni completar vacíos como hechos.
- Respetar jerarquía y autoridad de fuentes.
- Distinguir evidencia, inferencia, propuesta y decisión.
- La IA no sustituye la autoridad profesional humana.
- Detener o degradar la salida cuando falta información crítica.
- Señalar incoherencias relevantes.
- Ejecutar control de calidad antes del cierre.
- Proteger autoría y trabajo cognitivo cuando el producto involucra estudiantes.
- Alinear objetivo, evidencia, actividad y evaluación.
- Mantener rigor sin reducir exigencia arbitrariamente.
- No confundir actividad o cumplimiento con evidencia de dominio.
rules:
  R-TXD01-01: Todo contenido factual debe estar respaldado.
  R-TXD01-02: No inventar bibliografía, citas o referencias.
  R-TXD01-03: Lenguaje académico accesible al nivel previsto.
  R-TXD01-04: La explicación debe servir comprensión conceptual.
  R-TXD01-05: La lectura complementaria profundiza/contextualiza; no repite simplemente la explicación.
  R-TXD01-06: Respetar el formato exigido por el producto; en guías, APA 7.
procedure:
- phase: Paso 1 — Delimitar
  steps:
  - Confirmar propósito, audiencia y tipo de texto.
- phase: Paso 2 — Extraer
  steps:
  - Identificar solo afirmaciones sustentadas por fuentes.
- phase: Paso 3 — Redactar
  steps:
  - Organizar explicación clara o lectura complementaria.
  - Preservar sentido y trazabilidad.
- phase: Paso 4 — Verificar
  steps:
  - Revisar fidelidad, claridad, nivel y citas.
decision_logic:
- if: SI falta sustento para una afirmación
  then: ENTONCES omitirla o solicitar fuente.
- if: SI la lectura repite la explicación
  then: ENTONCES reformular para profundizar/contextualizar.
- if: SI una fuente es problemática
  then: ENTONCES advertir y pedir confirmación.
autonomous_actions:
- Organizar y parafrasear contenido sustentado.
- Ajustar claridad y secuencia.
- Generar conexiones lógicas no factuales.
human_reserved_actions:
- Autorizar fuentes dudosas.
- Aprobar cambios de propósito o profundidad disciplinar.
forbidden_actions:
- Inventar hechos, citas o bibliografía.
- Atribuir una fuente no aportada.
- Cambiar el sentido disciplinar.
outputs:
- Explicación principal.
- Lectura complementaria.
- Texto conceptual breve sustentado.
validation_states: []
quality_checks:
- ¿Toda afirmación factual está respaldada?
- ¿Es claro para el nivel?
- ¿Cumple el propósito?
- ¿No repite innecesariamente otro componente?
- ¿Citas/referencias son correctas?
sensitive_data: No requiere datos personales por defecto.
dependencies:
- dependency: Fuente autorizada
  function: Contenido.
- dependency: Planificación/producto llamante
  function: Propósito y formato.
handoff_conditions: []
completion_condition:
- Texto completo.
- Fuentes verificadas.
- QA de fidelidad y claridad superado.
functional_acceptance_criteria:
- scenario: Dato no soportado
  input: La fuente no menciona una fecha específica.
  expected: No debe añadirla.
- scenario: Lectura redundante
  input: La lectura repite la explicación casi palabra por palabra.
  expected: Debe diferenciarla y profundizar.
- scenario: Fuente dudosa
  input: Referencia no verificable.
  expected: Debe advertir antes de usarla.
open_issues:
- Reglas de adaptación por edad/ciclo.
- Política bilingüe.
- Extensiones por producto fuera de guías.
implementation_note: Implement as specified; preserve provisional/open status where indicated.
legacy_status_text: VALIDADA funcionalmente / pendiente de implementación técnica
legacy_component_type: MICRO_SKILL_TRANSVERSAL
