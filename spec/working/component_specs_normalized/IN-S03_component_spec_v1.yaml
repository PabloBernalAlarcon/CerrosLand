schema_version: '1.0'
component_id: IN-S03
component_type: SKILL
traits: []
name: Redacción de reporte de convivencia
domain: INSTITUTIONAL
head: null
version: '0.1'
lifecycle_status: ACTIVE
architecture_status: READY_WITH_CONDITIONS
implementation_status: IMPLEMENTABLE_WITH_CONDITIONS
deployment_status: PILOT_OR_BLOCKED
purpose: Convertir un análisis de convivencia y, cuando aplique, una clasificación preliminar validados en un reporte institucional
  neutral, presuntivo y trazable, devolviendo explícitamente la decisión final a la autoridad humana.
users:
  primary: profesional institucional autorizado
triggers:
- IN-S01 está completo y se requiere informe.
- IN-S02 ha sido aplicado cuando corresponde.
required_inputs:
- Análisis validado.
- Fuentes/versiones.
- Clasificación/gravedad si aplica.
- Destinatario/propósito institucional.
optional_inputs:
- Alertas no clínicas sustentadas.
authoritative_sources:
- source: IN-S01
  function: Hechos/versiones
  limit: Base factual.
- source: IN-S02
  function: Clasificación técnica
  limit: Debe presentarse como preliminar.
- source: Normativa convivencia
  function: Lenguaje/estructura
  limit: No sustituye decisión humana.
source_hierarchy: []
knowledge_dependencies:
- KP-010
core_rules_inherited:
- No inventar ni completar vacíos como hechos.
- Separar hechos, versiones, inferencias, propuestas y decisiones.
- Respetar jerarquía de fuentes y conservar contradicciones relevantes.
- La IA no sustituye la autoridad institucional o profesional humana.
- Bloquear o degradar la salida ante vacíos críticos.
- Ejecutar control de calidad antes del cierre.
- Usar lenguaje profesional, neutral y trazable.
- No convertir análisis técnico en sanción, calificación, diagnóstico o decisión administrativa.
- Separar productos internos de documentos destinados a familias/estudiantes.
- Conservar responsables, fechas y fuentes cuando son parte de la trazabilidad.
- Tratar la información personal/sensible como datos de caso, no conocimiento institucional permanente.
rules:
  R-INS03-01:
    title: Presunción
    text: No redactar culpabilidad como hecho definitivo.
  R-INS03-02:
    title: Trazabilidad
    text: Afirmaciones relevantes deben poder rastrearse a fuente/evidencia.
  R-INS03-03:
    title: Contradicciones
    text: No ocultar versiones incompatibles.
  R-INS03-04:
    title: Autoridad
    text: Cerrar devolviendo decisión a autoridad competente.
  R-INS03-05:
    title: Neutralidad
    text: Lenguaje técnico, no moralizante.
procedure:
- phase: Paso 1
  steps:
  - Validar insumos.
- phase: Paso 2
  steps:
  - Ordenar cronología, versiones, evidencia y análisis.
- phase: Paso 3
  steps:
  - Incorporar clasificación/gravedad como técnica preliminar.
- phase: Paso 4
  steps:
  - Cerrar con límites y decisión humana.
decision_logic:
- if: SI el caso sigue no validado
  then: ENTONCES no emitir reporte definitivo.
- if: SI una contradicción persiste
  then: ENTONCES consignarla.
- if: SI no aplica clasificación
  then: ENTONCES no inventarla.
autonomous_actions:
- Redactar desde información validada.
- Organizar cronología.
- Aplicar lenguaje presuntivo.
human_reserved_actions:
- Aprobar informe final.
- Decidir sanción/medida.
- Determinar responsabilidad.
forbidden_actions:
- Ocultar contradicciones.
- Condenar/sancionar.
- Inventar hechos.
- Diagnosticar.
outputs:
- Reporte de convivencia.
- Sección de fuentes/versiones.
- Clasificación preliminar cuando proceda.
- Límites/pendientes.
validation_states:
- state: VALIDADO
  condition: Puede emitirse como producto final dentro de la lógica funcional, sujeto a autoridad humana correspondiente.
  source: Documento Maestro de Continuidad v0.11 §9.4 (default general, aprobado 2026-11-24)
- state: PRELIMINAR
  condition: Borrador o estado intermedio; faltan elementos no críticos o validación.
  source: Documento Maestro de Continuidad v0.11 §9.4 (default general, aprobado 2026-11-24)
- state: NO VALIDADO
  condition: Falta información crítica, existe contradicción importante o la autoridad requerida no ha decidido.
  source: Documento Maestro de Continuidad v0.11 §9.4 (default general, aprobado 2026-11-24)
quality_checks:
- ¿Hechos y versiones distinguibles?
- ¿Clasificación marcada preliminar?
- ¿Contradicciones visibles?
- ¿Decisión final humana?
sensitive_data: Muy sensible y potencialmente disciplinario.
dependencies:
- dependency: IN-S01
  function: Análisis.
- dependency: IN-S02
  function: Clasificación cuando aplique.
- dependency: TX-I02
  function: Redacción institucional.
- dependency: TX-I01
  function: Alertas opcionales.
handoff_conditions: []
completion_condition:
- Reporte consistente.
- Fuentes trazables.
- Autoridad final devuelta al humano.
functional_acceptance_criteria:
- scenario: Caso incompleto
  input: Falta versión principal.
  expected: No debe emitir definitivo.
- scenario: Clasificación
  input: Tipo II preliminar.
  expected: Debe presentarla como análisis técnico, no sanción.
open_issues:
- Plantilla final.
- Audiencias/retención.
- Reglas de anexos.
implementation_note: Implement as specified; do not infer institutional authority or data governance.
legacy_status_text: VALIDADA funcionalmente / pendiente de implementación técnica
legacy_component_type: SKILL
