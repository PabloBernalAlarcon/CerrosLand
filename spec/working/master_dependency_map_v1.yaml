map_version: '1.0'
schema_note: Edge semantics are frozen. Only executable ORCHESTRATION edges transfer control.
execution_rules:
- Execute only edges with edge_class=ORCHESTRATION and executable=true.
- QUALITY/SUPPORT/DATA/KNOWLEDGE/STRUCTURAL edges are declarative and never transfer control.
- AUTHORITY edges reserve or transfer decisions to humans and are not component calls.
- FUTURE edges are non-executable.
- DISABLED and GAP targets cannot be invoked; any preserved orchestration relation to them is dormant.
edge_semantics_catalog:
  handoff:
    edge_class: ORCHESTRATION
    semantics: TRANSFER_CONTROL
    conditional: false
    normally_executable: true
  conditional_handoff:
    edge_class: ORCHESTRATION
    semantics: TRANSFER_CONTROL
    conditional: true
    normally_executable: true
  human_handoff:
    edge_class: AUTHORITY
    semantics: TRANSFER_TO_HUMAN
    conditional: true
    normally_executable: false
  invokes:
    edge_class: ORCHESTRATION
    semantics: CALL_COMPONENT
    conditional: false
    normally_executable: true
  conditional_invokes:
    edge_class: ORCHESTRATION
    semantics: CALL_COMPONENT
    conditional: true
    normally_executable: true
  specialization:
    edge_class: STRUCTURAL
    semantics: SPECIALIZES
    conditional: false
    normally_executable: false
  qa:
    edge_class: QUALITY
    semantics: REVIEWS
    conditional: false
    normally_executable: false
  conditional_qa:
    edge_class: QUALITY
    semantics: REVIEWS
    conditional: true
    normally_executable: false
  supports:
    edge_class: SUPPORT
    semantics: SUPPORTS
    conditional: false
    normally_executable: false
  supplies:
    edge_class: DATA
    semantics: SUPPLIES
    conditional: false
    normally_executable: false
  conditional_supplies:
    edge_class: DATA
    semantics: SUPPLIES
    conditional: true
    normally_executable: false
  uses_knowledge:
    edge_class: KNOWLEDGE
    semantics: USES_KNOWLEDGE
    conditional: false
    normally_executable: false
  human_authority:
    edge_class: AUTHORITY
    semantics: RESERVES_DECISION_TO
    conditional: false
    normally_executable: false
  future_interaction:
    edge_class: FUTURE
    semantics: NON_EXECUTABLE_FUTURE_RELATION
    conditional: true
    normally_executable: false
