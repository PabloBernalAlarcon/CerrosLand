name: checks

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Spec validation (schema, registry, map)
        run: python tools/validate_specs.py spec/working
      - name: Canonical consistency
        run: python tools/validate_phase0.py spec/working
      - name: Every executable edge governed by exactly one rule
        run: |
          python tools/build_edge_behavior.py spec/working | tee edge.txt
          grep -q "edges with zero or multiple rules: none" edge.txt
          git diff --exit-code spec/working/edge_behavior_v1.yaml
      - name: Delivered layer untouched
        run: python tools/check_delivered.py
      - name: Tests
        run: python -m pytest -q
