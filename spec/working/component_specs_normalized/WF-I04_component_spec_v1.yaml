schema_version: '1.0'
component_id: WF-I04
component_type: WORKFLOW
traits: []
name: Informe académico individual
domain: INSTITUTIONAL
head: null
version: '0.1'
lifecycle_status: ACTIVE
architecture_status: READY_WITH_CONDITIONS
implementation_status: IMPLEMENTABLE_WITH_CONDITIONS
deployment_status: PILOT_OR_BLOCKED
purpose: Producir un Informe Académico Individual para un estudiante, asignatura y periodo únicamente después de auditoría
  suficiente, manteniendo trazabilidad, recomendaciones concretas y separación entre producto externo e información técnica
  interna.
users:
  primary: docente/directivo autorizado
triggers:
- IN-S04 determina que el caso puede redactarse.
- Se requiere informe para comité/promoción/seguimiento con familia.
required_inputs:
- Resultado IN-S04.
- Identificación del caso.
- Contexto institucional del informe.
optional_inputs:
- Anexos autorizados.
- Recomendaciones del docente.
authoritative_sources:
- source: IN-S04
  function: Validación previa
  limit: No omitir vacíos.
- source: Formato/protocolo institucional
  function: Estructura
  limit: Debe versionarse.
- source: Datos del caso
  function: Contenido
  limit: No mezclar otros estudiantes/asignaturas/periodos.
source_hierarchy: []
knowledge_dependencies:
- KP-014
core_rules_inherited:
- No inventar ni completar vacíos como hechos.
- Separar hechos, versiones, inferencias, propuestas y decisiones.
- Respetar jerarquía de fuentes y conservar contradicciones relevantes.
- La IA no sustituye la autoridad institucional o profesional humana.
- Bloquear o degradar la salida ante vacíos críticos.
- Ejecutar control de calidad antes del cierre.
- Usar lenguaje profesional, neutral y trazable.
- No convertir análisis técnico en sanción, calificación, diagnóstico o decisión administrativa.
- Separar productos internos de documentos destinados a familias/estudiantes.
- Conservar responsables, fechas y fuentes cuando son parte de la trazabilidad.
- Tratar la información personal/sensible como datos de caso, no conocimiento institucional permanente.
rules:
  R-WFI04-01:
    title: Auditar primero
    text: No redactar definitivo antes de IN-S04.
  R-WFI04-02:
    title: Unidad
    text: No mezclar casos.
  R-WFI04-03:
    title: Conclusión
    text: Debe derivarse de evidencia/intervenciones/resultados.
  R-WFI04-04:
    title: Recomendaciones
    text: 2–4 recomendaciones según configuración recuperada; concretas y sustentadas.
  R-WFI04-05:
    title: Vacíos
    text: Conservar sección de información no documentada.
  R-WFI04-06:
    title: Audiencias
    text: Resumen Técnico interno no debe entregarse a estudiantes/familias.
  R-WFI04-07:
    title: Autoridad
    text: No decidir promoción ni sustituir comité.
procedure:
- phase: Fase 1
  steps:
  - Recibir auditoría y verificar estado.
- phase: Fase 2
  steps:
  - Redactar trayectoria del periodo con evidencia.
- phase: Fase 3
  steps:
  - Construir conclusión y 2–4 recomendaciones.
- phase: Fase 4
  steps:
  - Separar producto institucional externo de salida técnica interna.
- phase: Fase 5
  steps:
  - QA y validación humana.
decision_logic:
- if: SI IN-S04=NO VALIDADO
  then: ENTONCES no emitir informe definitivo.
- if: SI existe información no documentada
  then: ENTONCES consignarla sin rellenar.
- if: SI recomendación es vaga
  then: ENTONCES concretarla o pedir definición.
- if: SI se solicita decisión de promoción
  then: ENTONCES remitir a autoridad/comité.
autonomous_actions:
- Redactar desde evidencia validada.
- Estructurar conclusión/recomendaciones.
- Separar audiencias.
human_reserved_actions:
- Aprobar informe.
- Decidir promoción/medidas.
- Autorizar entrega a familia.
forbidden_actions:
- Ocultar vacíos.
- Inventar intervenciones.
- Exponer resumen interno a familias.
- Decidir promoción.
outputs:
- Informe Académico Individual.
- 2–4 recomendaciones.
- Sección información no documentada.
- Resumen Técnico interno según regla aplicable.
validation_states:
- state: VALIDADO
  condition: Puede emitirse como producto final dentro de la lógica funcional, sujeto a autoridad humana correspondiente.
  source: Documento Maestro de Continuidad v0.11 §9.4 (default general, aprobado 2026-11-24)
- state: PRELIMINAR
  condition: Borrador o estado intermedio; faltan elementos no críticos o validación.
  source: Documento Maestro de Continuidad v0.11 §9.4 (default general, aprobado 2026-11-24)
- state: NO VALIDADO
  condition: Falta información crítica, existe contradicción importante o la autoridad requerida no ha decidido.
  source: Documento Maestro de Continuidad v0.11 §9.4 (default general, aprobado 2026-11-24)
quality_checks:
- ¿IN-S04 permite cierre?
- ¿Conclusión sustentada?
- ¿2–4 recomendaciones concretas?
- ¿Audiencias separadas?
- ¿Sin psicologización?
sensitive_data: Datos académicos personales y documentación institucional.
dependencies:
- dependency: IN-S04
  function: Auditoría obligatoria.
- dependency: TX-I02
  function: Redacción institucional.
- dependency: Contexto comité/familia
  function: Audiencia.
handoff_conditions: []
completion_condition:
- Informe coherente.
- Vacíos visibles.
- Validación humana y audiencia correctas.
functional_acceptance_criteria:
- scenario: Caso no validado
  input: Faltan evidencias críticas.
  expected: No debe emitir informe definitivo.
- scenario: Familia
  input: Se prepara versión para padres.
  expected: No debe incluir Resumen Técnico interno.
open_issues:
- Obligatoriedad del Resumen Técnico.
- Formato final por contexto.
- Código/consecutivo institucional.
- Aprobación final.
implementation_note: Implement as specified; do not infer institutional authority or data governance.
legacy_status_text: VALIDADO funcionalmente / pendiente de implementación técnica
legacy_component_type: WORKFLOW
